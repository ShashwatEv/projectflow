<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <title>ProjectFlow Dashboard</title>
    <meta name="description" content="SaaS Project Management Dashboard" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const isDesktop = location.protocol === 'file:' || location.protocol === 'projectflow-app:';
        if ('serviceWorker' in navigator && !isDesktop) {
          if (isDev) {
            // In local development, unregister service workers and purge caches
            // to prevent stale Vite modules and broken HMR transforms.
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (const reg of registrations) {
                reg.unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (const key of keys) {
                  caches.delete(key);
                }
              });
            }
          } else {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js');
            });
          }
        }
      })();
    </script>
  </body>
</html>
